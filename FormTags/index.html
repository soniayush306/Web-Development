<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Tags</title>
  </head>
  <body>
    <fieldset>
      <legend align="center">Candidate Name</legend>
      <form>
        <label for="firstName">First Name: </label>
        <input
          type="text"
          name="yourFirstName"
          id="firstName"
          placeholder="Enter your First Name"
        />
        <br />
        <label for="lastName">Last Name: </label>
        <input
          type="text"
          name="yourLastName"
          id="lastName"
          placeholder="Enter your Last Name"
        />
        <br />
        <label for="email">Email ID: </label>
        <input
          type="email"
          name="yourEmail"
          id="email"
          placeholder="Enter your Email"
        />
        <br />
        <label for="phoneNo">Phone No.: </label>
        <input
          type="number"
          name="PhoneNo"
          id="phoneNo"
          placeholder="Enter Your Phone Number"
        />
        <br />
        <br />
        <label for="password">Password: </label>
        <input
          type="password"
          name="newPasswprd"
          id="password"
          placeholder="Enter a Password"
        />
        <br />
        <label for="cfpasswprd">Confirm Password: </label>
        <input
          type="password"
          name="confirmPassword"
          id="cfpassword"
          placeholder="Confirm your Passwprd"
        />
        <br />
        <br />
        <label for="DoB">Date of Birth</label>
        <input type="date" name="youyDoB" id="DoB" />
        <br />
        <label for="ToB">Time of Birth</label>
        <input type="time" name="yourToB" id="ToB" />
        <br />
        <br />
        <label for="volume">Volume</label>
        <input
          type="range"
          name="Volume"
          id="volume"
          min="0"
          max="100"
          value="70"
        />
        <br />
        <br />
        <label for="resume">Resume: </label>
        <input type="file" name="Resume" id="resume" />
        <br />
        <br />
        <label for="address">Enter Your Address: </label>
        <textarea name="Address" id="address"></textarea>
        <br />
        <br />
        <label for="cource">Course</label>
        <select name="Course" id="course">
          <option value="">--Select Course--</option>
          <option value="Btech">B.Tech</option>
          <option value="Mtech">M.Tech</option>
          <option value="BBA">BBA</option>
          <option value="MBA">MBA</option>
          <option value="MBBS">MBBS</option>
        </select>
        <br />
        <br />
        <label for="gender">Gender: </label>
        <input type="radio" name="gender" id="male" value="male" />
        <span>Male</span>
        <input type="radio" name="gender" id="female" value="female" />
        <span>Female</span>
        <input type="radio" name="gender" id="others" value="others" />
        <span>Others</span>
        <br />
        <br />
        <label for="skills">Skills: </label>
        <input type="checkbox" name="skills" id="java" value="java" />
        <span>JAVA</span>
        <input type="checkbox" name="skills" id="css" value="css" />
        <span>CSS</span>
        <input type="checkbox" name="skills" id="python" value="python" />
        <span>Python</span>
        <input type="checkbox" name="skills" id="DSA" value="DSA" />
        <span>DSA</span>
        <input type="checkbox" name="skills" id="HTML" />
        <span>HTML</span>
        <br />
        <br />
        <button>Submit</button>
        <button>Restart</button>
      </form>
    </fieldset>

    <img src="./SpiderMan 1.png" alt="" height="200" width="350" />
  </body>
</html>
