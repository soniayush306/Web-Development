<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ayush Studio</title>

    <style>
        /* ---------- BASIC RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ---------- BODY ---------- */
        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at 20% 20%, #243b55 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #1b263b 0%, transparent 35%),
                #080c14;

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ---------- MAIN CARD ---------- */
        .card {
            width: 100%;
            max-width: 420px;

            padding: 45px 38px;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5);

            text-align: center;
        }

        /* ---------- LOGO ---------- */
        .logo {
            width: 72px;
            height: 72px;

            margin: 0 auto 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #c9a227,
                #f8e7a1
            );

            color: #111827;

            font-size: 28px;
            font-weight: bold;

            box-shadow:
                0 8px 30px rgba(201, 162, 39, 0.25);
        }

        /* ---------- BADGE ---------- */
        .badge {
            display: inline-block;

            padding: 7px 14px;

            border-radius: 50px;

            background: rgba(201, 162, 39, 0.12);

            border: 1px solid rgba(201, 162, 39, 0.3);

            color: #e7ca67;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 2px;
        }

        /* ---------- HEADING ---------- */
        h1 {
            margin-top: 22px;

            font-size: 36px;
            line-height: 1.1;

            letter-spacing: -1px;
        }

        /* ---------- DESCRIPTION ---------- */
        .description {
            margin-top: 15px;

            color: #aeb7c6;

            font-size: 15px;
            line-height: 1.7;
        }

        /* ---------- DIVIDER ---------- */
        .divider {
            width: 60px;
            height: 2px;

            margin: 25px auto;

            background: #c9a227;
        }

        /* ---------- STATS ---------- */
        .stats {
            display: flex;
            justify-content: space-between;

            margin: 30px 0;
        }

        .stat {
            flex: 1;
        }

        .stat h2 {
            color: #e7ca67;

            font-size: 22px;

            margin-bottom: 6px;
        }

        .stat p {
            color: #8d98a9;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        /* ---------- BUTTON ---------- */
        .button {
            display: block;

            padding: 15px;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #c9a227,
                #f3dc82
            );

            color: #111827;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;

            transition: 0.3s ease;
        }

        /* ---------- BUTTON HOVER ---------- */
        .button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 30px rgba(201, 162, 39, 0.25);
        }

        /* ---------- FOOTER ---------- */
        .footer {
            margin-top: 22px;

            color: #667085;

            font-size: 11px;

            letter-spacing: 1px;
        }

        /* ---------- MOBILE ---------- */
        @media (max-width: 480px) {

            .card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 30px;
            }

            .stats {
                margin: 25px 0;
            }
        }
    </style>
</head>

<body>

    <!-- MAIN CARD -->
    <div class="card">

        <!-- LOGO -->
        <div class="logo">
            A
        </div>

        <!-- BADGE -->
        <span class="badge">
            PREMIUM STUDIO
        </span>

        <!-- TITLE -->
        <h1>
            Ayush Studio
        </h1>

        <!-- DESCRIPTION -->
        <p class="description">
            Creating elegant digital experiences with
            a clean, modern and premium approach.
        </p>

        <!-- DIVIDER -->
        <div class="divider"></div>

        <!-- STATS -->
        <div class="stats">

            <div class="stat">
                <h2>6K+</h2>
                <p>Audience</p>
            </div>

            <div class="stat">
                <h2>5M+</h2>
                <p>Reach</p>
            </div>

            <div class="stat">
                <h2>100%</h2>
                <p>Creative</p>
            </div>

        </div>

        <!-- BUTTON -->
        <a href="#" class="button">
            Explore Portfolio
        </a>

        <!-- FOOTER -->
        <div class="footer">
            MINIMAL • ELEGANT • PREMIUM
        </div>

    </div>

</body>
</html>
