<!doctype html>
<html>
  <head>
    <title>Ayush Studio</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: Arial;
        color: white;
        background: #080b12;
        text-align: center;
      }
      nav {
        padding: 25px 8%;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #ffffff15;
      }
      .logo {
        color: #d4af37;
        font-weight: bold;
      }
      nav a {
        color: #aaa;
        text-decoration: none;
        margin-left: 20px;
      }

      .hero {
        padding: 120px 20px;
      }
      .tag {
        color: #d4af37;
        letter-spacing: 3px;
        font-size: 12px;
      }
      h1 {
        font-size: 55px;
        margin: 20px;
      }
      h1 span {
        color: #d4af37;
      }
      p {
        color: #999;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        margin: 25px 5px;
        padding: 13px 25px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
      }
      .main {
        background: #d4af37;
        color: #111;
      }
      .alt {
        border: 1px solid #ffffff30;
        color: white;
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 70px;
        padding: 25px;
        border-top: 1px solid #ffffff15;
      }
      .stats h2 {
        color: #d4af37;
      }
      .stats p {
        font-size: 10px;
      }

      footer {
        padding: 20px;
        color: #555;
        font-size: 12px;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 40px;
        }
        .hero {
          padding: 90px 20px;
        }
        .stats {
          gap: 30px;
        }
      }
    </style>
  </head>

  <body>
    <nav>
      <b class="logo">AYUSH.</b>
      <div>
        <a href="#">Home</a>
        <a href="#">Work</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <section class="hero">
      <span class="tag">CREATIVE • DIGITAL • PREMIUM</span>
      <h1>Ideas that look<br /><span>remarkable.</span></h1>

      <p>Building clean, modern and meaningful digital experiences.</p>

      <a href="#" class="btn main">Explore Work</a>
      <a href="#" class="btn alt">Contact Me</a>
    </section>

    <div class="stats">
      <div>
        <h2>6K+</h2>
        <p>COMMUNITY</p>
      </div>
      <div>
        <h2>5M+</h2>
        <p>REACH</p>
      </div>
      <div>
        <h2>50+</h2>
        <p>PROJECTS</p>
      </div>
    </div>

    <footer>© 2026 Ayush Studio</footer>
  </body>
</html>
