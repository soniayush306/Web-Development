<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Website</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#ffd6e7,#e0f7ff);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:white;
      width:300px;
      padding:25px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,.15);
    }

    h1{
      color:#ff4f8b;
      margin:10px 0;
    }

    p{
      color:#666;
      font-size:15px;
    }

    .btn{
      display:inline-block;
      margin-top:15px;
      padding:10px 20px;
      background:#ff7aa2;
      color:white;
      text-decoration:none;
      border-radius:30px;
      font-weight:bold;
    }

    .heart{
      font-size:50px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">💖</div>
    <h1>Hello Ayush!</h1>
    <p>Welcome to your cute little website. Have a wonderful day ✨</p>
    <a href="#" class="btn">Smile 😊</a>
  </div>

</body>
</html>
