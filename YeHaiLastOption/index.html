<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Landing</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0f172a;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    width:340px;
    padding:32px;
    border-radius:22px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.logo{
    width:60px;height:60px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#d4af37,#f7e7a1);
    color:#111;
    font-size:26px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}
h1{
    margin:20px 0 8px;
    font-size:28px;
}
p{
    color:#cbd5e1;
    font-size:14px;
    line-height:1.6;
}
.btn{
    display:inline-block;
    margin-top:24px;
    padding:12px 28px;
    border-radius:30px;
    text-decoration:none;
    color:#111;
    font-weight:bold;
    background:linear-gradient(135deg,#d4af37,#f7e7a1);
}
.footer{
    margin-top:18px;
    font-size:12px;
    color:#94a3b8;
}
</style>
</head>

<body>
<div class="card">
    <div class="logo">A</div>

    <h1>Ayush Studio</h1>

    <p>
        Elegant. Minimal. Professional. A premium landing page crafted
        with pure HTML & CSS for a modern first impression.
    </p>

    <a href="#" class="btn">Explore</a>

    <div class="footer">Designed with simplicity ✦</div>
</div>
</body>
</html>
