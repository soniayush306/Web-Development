<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoList</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1
        class="display-3 fw-bold d-flex justify-content-center p-3 text-white"
        id="heading"
      >
        My Todo List
      </h1>
      <h5
        class="display-6 fw-normal d-flex justify-content-center p-0 text-white"
      >
        Organise your day, one task at a time.
      </h5>
    </header>

    <main>
      <div class="container rounded shadow p-3 mt-4 d-flex gap-3">
        <input
          type="text"
          class="form-control"
          id="taskInput"
          placeholder="Enter a new task"
        />
        <button
          class="btn btn-primary col-2"
          onclick="addTask()"
        >
          Add Task
        </button>
      </div>

      <section class="container p-3 border rounded shadow mt-3 d-flex gap-4">
        <ol class="w-100" id="taskList">
          <!-- <li class="p-3 d-flex">
            <div>Task1</div>
            <button class="btn btn-danger btn-sm ms-3">Delete</button>
          </li> -->
        </ol>
      </section>

      <section class="container rounded shadow p-3 mt-3">
        <div class="d-flex gap-4 justify-content-sm-between">
            <div  class="d-flex gap-3">
              <input type="checkbox">
              <div class="p-2">Task Ka Naam</div>
            </div>
            <div>
              <button class="btn btn-primary">Edit</button>
              <button class="btn btn-danger">Delete</button>
            </div>
        </div>
      </section>

    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
